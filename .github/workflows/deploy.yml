name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: polyester-deploy
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Install it and smoke test the entry point
        run: |
          python3 -m pip install dist/polyester_bot-*.whl
          if polyester-bot 2>&1 | grep -q "missing credentials"; then
            echo "entry point ok"
          else
            echo "entry point failed"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: |
          pip install -q "polyester-sdk>=0.6.0,<0.7" "pynacl>=1.5"
          python3 tests/test_sell_loop.py
          python3 tests/test_freeze_detect.py
          python3 tests/test_paths.py
          python3 tests/test_stuck.py
          python3 tests/test_setup.py
          python3 tests/test_fees.py
          python3 tests/test_chase.py
          python3 tests/test_deadman.py
          python3 tests/test_amend.py
          python3 tests/test_tp_trigger.py
          python3 tests/test_ws.py
          python3 tests/test_liquidity.py
          python3 tests/test_equity.py
          python3 tests/test_preflight.py
          python3 tests/test_orphan.py
          python3 tests/test_chase_score.py
          python3 tests/test_volume_alert.py

      - name: Configure SSH
        env:
          INSTABOX_SSH_KEY: ${{ secrets.INSTABOX_SSH_KEY }}
          HOST: ${{ vars.INSTABOX_HOST }}
          PORT: ${{ vars.INSTABOX_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$INSTABOX_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying"
            sleep 10
          done
          grep -qE "^[^#]*${HOST}" ~/.ssh/known_hosts

      - name: Ship code to instabox
        env:
          HOST: ${{ vars.INSTABOX_HOST }}
          PORT: ${{ vars.INSTABOX_PORT }}
          USER: ${{ vars.INSTABOX_USER }}
        run: |
          set -euo pipefail
          tar czf - bot deploy | ssh -p "$PORT" "$USER@$HOST" \
            'rm -rf ~/polyester-deploy && mkdir -p ~/polyester-deploy && tar xzf - -C ~/polyester-deploy'

      - name: Deploy and restart
        env:
          HOST: ${{ vars.INSTABOX_HOST }}
          PORT: ${{ vars.INSTABOX_PORT }}
          USER: ${{ vars.INSTABOX_USER }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" "$USER@$HOST" 'bash ~/polyester-deploy/deploy/deploy.sh'

      - name: Verify
        env:
          HOST: ${{ vars.INSTABOX_HOST }}
          PORT: ${{ vars.INSTABOX_PORT }}
          USER: ${{ vars.INSTABOX_USER }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" "$USER@$HOST" \
            'systemctl is-active polyester-bot && journalctl -u polyester-bot -n 15 --no-pager'
